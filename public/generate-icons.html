<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function draw(id, size) {
  const c = document.getElementById(id)
  const ctx = c.getContext('2d')
  const r = size * 0.18
  // Background
  ctx.fillStyle = '#7FB59A'
  ctx.beginPath()
  ctx.roundRect(0, 0, size, size, r)
  ctx.fill()
  // Spoon shape
  ctx.fillStyle = '#fff'
  const cx = size / 2, cy = size / 2
  const s = size * 0.28
  // Bowl of spoon
  ctx.beginPath()
  ctx.ellipse(cx, cy - s * 0.3, s * 0.55, s * 0.65, 0, 0, Math.PI * 2)
  ctx.fill()
  // Handle
  ctx.beginPath()
  ctx.roundRect(cx - s * 0.12, cy + s * 0.3, s * 0.24, s * 1.1, s * 0.12)
  ctx.fill()
  console.log(id, c.toDataURL())
}
draw('c192', 192)
draw('c512', 512)
</script>
</body>
</html>
