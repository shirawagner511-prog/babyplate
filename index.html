<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#7FB59A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BabyPlate" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>BabyPlate 🥄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; }
      body {
        height: 100%;
        font-family: 'Rubik', system-ui, sans-serif;
        background: #FAFAF7;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      #root {
        height: 100%;
        height: 100dvh;
      }

      /* Scrollbar hiding */
      ::-webkit-scrollbar { display: none; }
      * { -ms-overflow-style: none; scrollbar-width: none; }

      /* Range slider styling */
      input[type=range] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 3px;
        outline: none;
        cursor: pointer;
        background: linear-gradient(
          to left,
          #7FB59A calc(var(--pct, 50%)),
          #E8E2DA calc(var(--pct, 50%))
        );
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #7FB59A;
        border: 3px solid #fff;
        box-shadow: 0 2px 8px rgba(127,181,154,0.4);
        cursor: pointer;
      }
      input[type=range]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #7FB59A;
        border: 3px solid #fff;
        box-shadow: 0 2px 8px rgba(127,181,154,0.4);
        cursor: pointer;
      }

      /* Sheet backdrop */
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(44, 40, 38, 0.45);
        z-index: 49;
        animation: fadeIn 0.2s ease;
      }
      .sheet-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-radius: 24px 24px 0 0;
        z-index: 50;
        animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        max-height: 92dvh;
        overflow-y: auto;
        box-shadow: 0 -8px 40px rgba(44,40,38,0.12);
      }
      .grabber {
        width: 40px;
        height: 4px;
        background: #E8E2DA;
        border-radius: 2px;
        margin: 12px auto 4px;
      }
      @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
      @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 96px;
        left: 50%;
        transform: translateX(-50%);
        background: #2C2826;
        color: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        z-index: 100;
        white-space: nowrap;
        animation: toastIn 0.2s ease;
        box-shadow: 0 4px 20px rgba(44,40,38,0.25);
      }
      @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(8px) } to { opacity: 1; transform: translateX(-50%) translateY(0) } }

      /* Button resets */
      button { font-family: inherit; cursor: pointer; border: none; outline: none; }
      input, textarea { font-family: inherit; outline: none; }
      textarea { resize: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
